name: Mac trial package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          architecture: arm64
          cache: npm
      - name: Require Apple Silicon runner and runtime
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - run: npm ci
      - run: npm run repo:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:build
      - run: npm run desktop:verify
      - run: npm run release:check
      - name: Upload only distributable trial files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Work-Inbox-macOS-arm64-${{ github.sha }}
          path: |
            release/Work-Inbox-*-macOS-arm64.zip
            release/Work-Inbox-*-macOS-arm64.dmg
            release/Work-Inbox-*-macOS-arm64.build.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
